<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo PDF — Inova Fortis EPIs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aoboshi+One&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── RESET ──────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0D1B2A; --orange:#FD7A22; --blue:#365EB5;
      --white:#FFFFFF; --cream:#F8F7F3; --ink:#1C2434;
      --muted:#64748B; --border:#E2E8F0;
    }
    html{-webkit-font-smoothing:antialiased}
    body{font-family:'Open Sans',sans-serif;background:#f0f0f0;color:var(--ink)}

    /* ── BOTÃO GERAR PDF ────────────────────────── */
    .pdf-controls{
      position:fixed;top:0;left:0;right:0;z-index:999;
      background:var(--navy);padding:12px 24px;
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;
    }
    .pdf-controls p{font-size:13px;color:rgba(255,255,255,0.6)}
    .pdf-controls p strong{color:var(--orange)}
    .btn-gerar{
      padding:10px 24px;background:var(--orange);border:none;
      border-radius:8px;color:#fff;font-size:14px;font-weight:700;
      cursor:pointer;font-family:inherit;
      display:flex;align-items:center;gap:8px;
    }
    .btn-gerar:hover{background:#E5620A}

    /* ── PÁGINA A4 ──────────────────────────────── */
    .page{
      width:210mm;
      margin:72px auto 16px;
      background:#fff;
      box-shadow:0 4px 24px rgba(0,0,0,0.15);
    }

    /* ── CAPA ───────────────────────────────────── */
    .cover{
      height:297mm;
      background:var(--navy);
      display:flex;flex-direction:column;
      position:relative;overflow:hidden;
    }
    .cover-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:var(--orange)}
    .cover-bottom{position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--orange)}
    .cover-bg-text{
      position:absolute;right:-20px;bottom:60px;
      font-family:'Aoboshi One',serif;font-size:180px;
      color:rgba(255,255,255,0.04);line-height:1;user-select:none;
    }
    .cover-body{
      flex:1;padding:60px 56px;
      display:flex;flex-direction:column;justify-content:center;
      position:relative;z-index:1;
    }
    .cover-eyebrow{
      font-size:10px;font-weight:700;letter-spacing:.22em;
      text-transform:uppercase;color:var(--orange);
      margin-bottom:24px;display:flex;align-items:center;gap:10px;
    }
    .cover-eyebrow::before{content:'';width:32px;height:2px;background:var(--orange)}
    .cover-title{
      font-family:'Aoboshi One',serif;
      font-size:64px;color:#fff;line-height:1.0;letter-spacing:-.02em;
      margin-bottom:8px;
    }
    .cover-title span{color:var(--orange)}
    .cover-year{
      font-family:'Aoboshi One',serif;font-size:110px;
      color:rgba(255,255,255,0.07);line-height:1;margin-bottom:28px;
    }
    .cover-tagline{
      font-size:18px;color:rgba(255,255,255,0.55);
      border-left:3px solid var(--orange);padding-left:16px;
      line-height:1.5;max-width:400px;margin-bottom:48px;
    }
    .cover-logo{margin-bottom:32px}
    .cover-logo img{height:110px;width:auto;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.3))}
    .cover-footer{
      border-top:1px solid rgba(255,255,255,0.08);
      padding:16px 56px;position:relative;z-index:1;
      display:flex;align-items:center;gap:32px;
    }
    .cover-stat{font-size:11px;color:rgba(255,255,255,0.3)}
    .cover-stat strong{color:rgba(255,255,255,0.6);display:block;font-size:12px}

    /* ── SOBRE ──────────────────────────────────── */
    .about-page{height:297mm;padding:56px;display:flex;flex-direction:column;justify-content:center;background:var(--cream)}
    .section-label{
      font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
      color:var(--orange);margin-bottom:10px;
      display:flex;align-items:center;gap:8px;
    }
    .section-label::before{content:'';width:24px;height:2px;background:var(--orange)}
    .about-title{
      font-family:'Aoboshi One',serif;font-size:36px;
      color:var(--navy);margin-bottom:20px;line-height:1.15;
    }
    .about-text{font-size:13px;color:var(--muted);line-height:1.8;max-width:520px;margin-bottom:32px}
    .about-values{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
    .value-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px 16px;border-left:3px solid var(--orange)}
    .value-title{font-family:'Aoboshi One',serif;font-size:14px;color:var(--navy);margin-bottom:6px}
    .value-text{font-size:11px;color:var(--muted);line-height:1.5}
    .about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .about-stat{background:var(--navy);border-radius:8px;padding:16px;text-align:center}
    .about-stat-num{font-family:'Aoboshi One',serif;font-size:24px;color:var(--orange)}
    .about-stat-label{font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px}

    /* ── DIVISOR DE CATEGORIA ───────────────────── */
    .cat-page{position:relative;overflow:hidden;
      height:180px;background:var(--navy);
      padding:40px 56px;display:flex;flex-direction:column;justify-content:center;
      position:relative;overflow:hidden;
    }
    .cat-page::before{content:'';position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--orange)}
    .cat-page-ghost{
      position:absolute;right:50px;top:50%;transform:translateY(-50%);
      font-family:'Aoboshi One',serif;font-size:100px;
      color:rgba(255,255,255,0.04);white-space:nowrap;
    }
    .cat-num{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
    .cat-name{font-family:'Aoboshi One',serif;font-size:40px;color:#fff;margin-bottom:8px}
    .cat-desc-text{font-size:12px;color:rgba(255,255,255,0.4);max-width:480px;line-height:1.6;padding-left:12px;border-left:2px solid rgba(253,122,34,0.3)}
    .cat-nr-badge{
      margin-top:10px;display:inline-flex;align-items:center;
      background:rgba(253,122,34,0.10);border:1px solid rgba(253,122,34,0.2);
      border-radius:99px;padding:3px 10px;
      font-size:9px;font-weight:700;color:var(--orange);letter-spacing:.05em;
    }

    /* ── GRADE DE PRODUTOS ──────────────────────── */
    .products-page{padding:32px 40px;background:#fff}
    .cat-page-label{
      font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:var(--muted);margin-bottom:20px;padding-bottom:10px;
      border-bottom:2px solid var(--orange);display:flex;justify-content:space-between;
    }
    .products-grid-pdf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

    /* ── CARD ───────────────────────────────────── */
    .card{border:1px solid var(--border);border-radius:8px;overflow:hidden;page-break-inside:avoid}
    .card-img{aspect-ratio:1/1;background:var(--cream);overflow:hidden}
    .card-img img{width:100%;height:100%;object-fit:contain;padding:10px}
    .card-body{padding:12px}
    .card-brand{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
    .card-name{font-family:'Aoboshi One',serif;font-size:12px;color:var(--navy);line-height:1.3;margin-bottom:6px}
    .card-ca{font-size:9px;font-weight:700;background:rgba(54,94,181,0.08);border:1px solid rgba(54,94,181,0.2);color:var(--blue);border-radius:4px;padding:1px 6px;display:inline-block;margin-bottom:8px}
    .card-specs-pdf{border-top:1px solid var(--border);padding-top:8px;display:grid;gap:3px}
    .spec-row-pdf{display:flex;gap:6px;font-size:9px}
    .spec-key-pdf{color:var(--muted);font-weight:600;min-width:60px;flex-shrink:0}
    .spec-val-pdf{color:var(--ink);font-weight:500}
    .card-vars-pdf{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
    .var-label-pdf{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
    .var-chips-pdf{display:flex;flex-wrap:wrap;gap:2px}
    .var-chip-pdf{font-size:8px;font-weight:600;border:1px solid var(--border);border-radius:3px;padding:1px 5px;color:var(--ink)}

    /* ── CONTATO ────────────────────────────────── */
    .contact-page{height:297mm;background:var(--navy);padding:60px 56px;display:flex;flex-direction:column;justify-content:center}
    .contact-title{font-family:'Aoboshi One',serif;font-size:40px;color:#fff;margin-bottom:12px;margin-top:24px}
    .contact-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:40px;line-height:1.7;max-width:440px}
    .contact-items{display:flex;flex-direction:column;gap:14px}
    .contact-item{
      display:flex;align-items:center;gap:16px;
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
      border-radius:10px;padding:16px 20px;
    }
    .contact-label{font-size:10px;color:rgba(255,255,255,0.35);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .contact-value{font-size:16px;color:#fff;font-weight:600;margin-top:2px}
    .contact-footer-pdf{
      margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.08);
      display:flex;align-items:center;justify-content:space-between;
    }
    .contact-cnpj-pdf{font-size:11px;color:rgba(255,255,255,0.2)}


    /* ── MARCAS ──────────────────────────────────── */
    .brands-page{padding:48px 56px;background:var(--navy);min-height:200px}
    .brands-strip-pdf{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .brand-chip-pdf{
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;padding:12px 18px;
      display:flex;align-items:center;justify-content:center;
      min-width:90px;height:52px;
    }
    .brand-chip-pdf img{max-height:26px;max-width:90px;object-fit:contain;filter:brightness(0) invert(1);opacity:.8}
    .brand-chip-pdf span{font-family:'Aoboshi One',serif;font-size:13px;color:rgba(255,255,255,0.75);letter-spacing:.02em}

    /* ── PRINT ──────────────────────────────────── */
    @page{size:A4;margin:0}
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
      body{background:#fff}
      .pdf-controls{display:none!important}
      .page{margin:0;box-shadow:none;width:100%}
      .cover,.about-page,.contact-page{page-break-after:always}
      .cat-page{position:relative;overflow:hidden;page-break-before:always;page-break-after:avoid}
      .products-page{page-break-inside:auto}
      .card{page-break-inside:avoid}
    }
  </style>
</head>

function renderCard(p){
  const img = CDN + p.img + '-480-0.webp';
  const specs = (p.specs||[]).map(([k,v])=>`<div class="spec-row-pdf"><span class="spec-key-pdf">${k}</span><span class="spec-val-pdf">${v}</span></div>`).join('');
  const vars = p.v ? `<div class="card-vars-pdf">
    ${p.v.t ? `<span class="var-label-pdf">Tamanhos</span><div class="var-chips-pdf">${(Array.isArray(p.v.t)?p.v.t:[p.v.t]).map(s=>`<span class="var-chip-pdf">${s}</span>`).join('')}</div>` : ''}
    ${p.v.c ? `<span class="var-label-pdf" style="margin-top:4px">Cores</span><div class="var-chips-pdf">${p.v.c.map(s=>`<span class="var-chip-pdf">${s}</span>`).join('')}</div>` : ''}
  </div>` : '';
  return `<div class="card">
    <div class="card-img"><img src="${img}" alt="${p.n}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23F0EEE8%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'"></div>
    <div class="card-body">
      ${p.brand?`<div class="card-brand">${p.brand}</div>`:''}
      <div class="card-name">${p.n}</div>
      ${p.ca?`<div class="card-ca">${p.ca}</div>`:''}
      ${specs?`<div class="card-specs-pdf">${specs}</div>`:''}
      ${vars}
    </div>
  </div>`;
}
