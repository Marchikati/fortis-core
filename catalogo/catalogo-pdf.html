<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo PDF · Inova Fortis EPIs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aoboshi+One&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── RESET ──────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0D1B2A; --orange:#FD7A22; --blue:#365EB5;
      --white:#FFFFFF; --cream:#F8F7F3; --ink:#1C2434;
      --muted:#64748B; --border:#E2E8F0;
    }
    html{-webkit-font-smoothing:antialiased}
    body{font-family:'Open Sans',sans-serif;background:#f0f0f0;color:var(--ink)}

    /* ── BOTÃO GERAR PDF ────────────────────────── */
    .pdf-controls{
      position:fixed;top:0;left:0;right:0;z-index:999;
      background:var(--navy);padding:12px 24px;
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;
    }
    .pdf-controls p{font-size:13px;color:rgba(255,255,255,0.6)}
    .pdf-controls p strong{color:var(--orange)}
    .btn-gerar{
      padding:10px 24px;background:var(--orange);border:none;
      border-radius:8px;color:#fff;font-size:14px;font-weight:700;
      cursor:pointer;font-family:inherit;
      display:flex;align-items:center;gap:8px;
    }
    .btn-gerar:hover{background:#E5620A}

    /* ── PÁGINA A4 ──────────────────────────────── */
    .page{
      width:210mm;
      min-height:297mm;
      margin:72px auto 16px;
      background:#fff;
      box-shadow:0 4px 24px rgba(0,0,0,0.15);
    }

    /* ── CAPA ───────────────────────────────────── */
    .cover{
      height:297mm;
      background:var(--navy);
      display:flex;flex-direction:column;
      position:relative;overflow:hidden;
    }
    .cover-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:var(--orange)}
    .cover-bottom{position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--orange)}
    .cover-bg-text{
      position:absolute;right:-20px;bottom:60px;
      font-family:'Aoboshi One',serif;font-size:180px;
      color:rgba(255,255,255,0.04);line-height:1;user-select:none;
    }
    .cover-body{
      flex:1;padding:60px 56px 90px;
      display:flex;flex-direction:column;justify-content:center;
      position:relative;z-index:1;
    }
    .cover-eyebrow{
      font-size:10px;font-weight:700;letter-spacing:.22em;
      text-transform:uppercase;color:var(--orange);
      margin-bottom:24px;display:flex;align-items:center;gap:10px;
    }
    .cover-eyebrow::before{content:'';width:32px;height:2px;background:var(--orange)}
    .cover-title{
      font-family:'Aoboshi One',serif;
      font-size:64px;color:#fff;line-height:1.0;letter-spacing:-.02em;
      margin-bottom:8px;
    }
    .cover-title span{color:var(--orange)}
    .cover-year{
      font-family:'Aoboshi One',serif;font-size:110px;
      color:rgba(255,255,255,0.07);line-height:1;margin-bottom:28px;
    }
    .cover-tagline{
      font-size:18px;color:rgba(255,255,255,0.55);
      border-left:3px solid var(--orange);padding-left:16px;
      line-height:1.5;max-width:400px;margin-bottom:48px;
    }
    .cover-logo{margin-bottom:28px}
    .cover-logo img{width:200px;height:auto;display:block;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.3))}
    .cover-footer{
      position:absolute;bottom:0;left:0;right:0;
      border-top:1px solid rgba(255,255,255,0.08);
      padding:16px 56px;z-index:2;
      display:flex;align-items:center;gap:32px;
    }
    .cover-stat{font-size:11px;color:rgba(255,255,255,0.3)}
    .cover-stat strong{color:rgba(255,255,255,0.6);display:block;font-size:12px}

    /* ── SOBRE ──────────────────────────────────── */
    .about-page{height:297mm;padding:56px;display:flex;flex-direction:column;justify-content:center;background:var(--cream)}
    .section-label{
      font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
      color:var(--orange);margin-bottom:10px;
      display:flex;align-items:center;gap:8px;
    }
    .section-label::before{content:'';width:24px;height:2px;background:var(--orange)}
    .about-title{
      font-family:'Aoboshi One',serif;font-size:36px;
      color:var(--navy);margin-bottom:20px;line-height:1.15;
    }
    .about-text{font-size:13px;color:var(--muted);line-height:1.8;max-width:520px;margin-bottom:32px}
    .about-values{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
    .value-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px 16px;border-left:3px solid var(--orange)}
    .value-title{font-family:'Aoboshi One',serif;font-size:14px;color:var(--navy);margin-bottom:6px}
    .value-text{font-size:11px;color:var(--muted);line-height:1.5}
    .about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .about-stat{background:var(--navy);border-radius:8px;padding:16px;text-align:center}
    .about-stat-num{font-family:'Aoboshi One',serif;font-size:24px;color:var(--orange)}
    .about-stat-label{font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px}

    /* ── DIVISOR DE CATEGORIA ───────────────────── */
    /* ── DIVISOR DE CATEGORIA — hero image + gradient ──────────────── */
    .cat-page{
      position:relative;overflow:hidden;
      height:297mm;background:var(--navy);
      display:flex;flex-direction:column;
    }
    .cat-hero-bg{
      position:absolute;inset:0;
      background-size:cover;background-repeat:no-repeat;
    }
    .cat-hero-overlay{
      position:absolute;inset:0;
      background:linear-gradient(
        to top,
        #0D1B2A 0%,
        #0D1B2A 30%,
        rgba(13,27,42,0.88) 52%,
        rgba(13,27,42,0.55) 72%,
        rgba(13,27,42,0.18) 100%
      );
    }
    .cat-page-ghost{
      position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);
      font-family:'Aoboshi One',serif;font-size:120px;
      color:rgba(255,255,255,0.055);white-space:nowrap;
      text-align:center;letter-spacing:-.02em;pointer-events:none;
      z-index:2;
    }
    .cat-content{
      position:absolute;bottom:0;left:0;right:0;z-index:3;
      padding:0 56px 52px;
    }
    .cat-num{
      font-size:10px;font-weight:700;letter-spacing:.22em;
      text-transform:uppercase;color:var(--orange);
      margin-bottom:14px;display:flex;align-items:center;gap:10px;
    }
    .cat-num::before{content:'';width:32px;height:2px;background:var(--orange);flex-shrink:0}
    .cat-name{
      font-family:'Aoboshi One',serif;font-size:52px;
      color:#fff;line-height:1.0;letter-spacing:-.02em;margin-bottom:16px;
    }
    .cat-desc-text{
      font-size:13px;color:rgba(255,255,255,0.5);max-width:500px;
      line-height:1.7;margin-bottom:20px;
    }
    .cat-nr-badge{
      display:inline-flex;align-items:center;
      background:rgba(253,122,34,0.12);border:1px solid rgba(253,122,34,0.25);
      border-radius:99px;padding:4px 12px;
      font-size:9px;font-weight:700;color:var(--orange);letter-spacing:.08em;
    }

    /* ── GRADE DE PRODUTOS ──────────────────────── */
    .products-page{padding:32px 40px;background:#fff}
    .cat-page-label{
      font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:var(--muted);margin-bottom:20px;padding-bottom:10px;
      border-bottom:2px solid var(--orange);display:flex;justify-content:space-between;
    }
    .products-grid-pdf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

    /* ── CARD ───────────────────────────────────── */
    .card{border:1px solid var(--border);border-radius:8px;overflow:hidden;page-break-inside:avoid}
    .card-img{aspect-ratio:1/1;background:var(--cream);overflow:hidden}
    .card-img img{width:100%;height:100%;object-fit:contain;padding:10px}
    .card-body{padding:12px}
    .card-brand{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
    .card-name{font-family:'Aoboshi One',serif;font-size:12px;color:var(--navy);line-height:1.3;margin-bottom:6px}
    .card-ca{font-size:9px;font-weight:700;background:rgba(54,94,181,0.08);border:1px solid rgba(54,94,181,0.2);color:var(--blue);border-radius:4px;padding:1px 6px;display:inline-block;margin-bottom:8px}
    .card-specs-pdf{border-top:1px solid var(--border);padding-top:8px;display:grid;gap:3px}
    .spec-row-pdf{display:flex;gap:6px;font-size:9px}
    .spec-key-pdf{color:var(--muted);font-weight:600;min-width:60px;flex-shrink:0}
    .spec-val-pdf{color:var(--ink);font-weight:500}
    .card-vars-pdf{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
    .var-label-pdf{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
    .var-chips-pdf{display:flex;flex-wrap:wrap;gap:2px}
    .var-chip-pdf{font-size:8px;font-weight:600;border:1px solid var(--border);border-radius:3px;padding:1px 5px;color:var(--ink)}

    /* ── CONTATO ────────────────────────────────── */
    .contact-page{height:297mm;background:var(--navy);padding:60px 56px;display:flex;flex-direction:column;justify-content:center}
    .contact-title{font-family:'Aoboshi One',serif;font-size:40px;color:#fff;margin-bottom:12px;margin-top:24px}
    .contact-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:40px;line-height:1.7;max-width:440px}
    .contact-items{display:flex;flex-direction:column;gap:14px}
    .contact-item{
      display:flex;align-items:center;gap:16px;
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
      border-radius:10px;padding:16px 20px;
    }
    .contact-label{font-size:10px;color:rgba(255,255,255,0.35);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .contact-value{font-size:16px;color:#fff;font-weight:600;margin-top:2px}
    .contact-footer-pdf{
      margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.08);
      display:flex;align-items:center;justify-content:space-between;
    }
    .contact-cnpj-pdf{font-size:11px;color:rgba(255,255,255,0.2)}


    /* ── MARCAS ──────────────────────────────────── */
    .brands-page{padding:48px 56px;background:var(--navy);height:297mm;display:flex;flex-direction:column;overflow:hidden}
    .brands-strip-pdf{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .brand-chip-pdf{
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;padding:12px 18px;
      display:flex;align-items:center;justify-content:center;
      min-width:90px;height:52px;
    }
    .brand-chip-pdf img{max-height:26px;max-width:90px;object-fit:contain;opacity:.9}
    .brand-chip-pdf span{font-family:'Aoboshi One',serif;font-size:13px;color:rgba(255,255,255,0.75);letter-spacing:.02em}

    /* ── PRINT ──────────────────────────────────── */
    @page{size:A4;margin:0}
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
      body{background:#fff}
      .pdf-controls{display:none!important}
      .page{
        margin:0;box-shadow:none;width:100%;
        page-break-after:always;break-after:page;
        page-break-inside:avoid;break-inside:avoid;
        overflow:hidden;
      }
      .page.flow{
        page-break-inside:auto;break-inside:auto;
        overflow:visible;
        height:auto;
      }
      .card{page-break-inside:avoid;break-inside:avoid}
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

</div>

// ── RENDERIZAÇÃO ────────────────────────────────────────────────────────────
function renderCard(p){
  const img = CDN + p.img + '-480-0.webp';
  const specs = (p.specs||[]).filter(([k,v])=>v!=='—').map(([k,v])=>`<div class="spec-row-pdf"><span class="spec-key-pdf">${k}</span><span class="spec-val-pdf">${v}</span></div>`).join('');
  const vars = p.v ? `<div class="card-vars-pdf">
    ${p.v.t ? `<span class="var-label-pdf">Tamanhos</span><div class="var-chips-pdf">${(Array.isArray(p.v.t)?p.v.t:[p.v.t]).map(s=>`<span class="var-chip-pdf">${s}</span>`).join('')}</div>` : ''}
    ${p.v.c ? `<span class="var-label-pdf" style="margin-top:4px">Cores</span><div class="var-chips-pdf">${p.v.c.map(s=>`<span class="var-chip-pdf">${s}</span>`).join('')}</div>` : ''}
  </div>` : '';
  return `<div class="card">
    <div class="card-img"><img src="${img}" alt="${p.n}" loading="eager" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23F0EEE8%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'"></div>
    <div class="card-body">
      ${p.brand?`<div class="card-brand">${p.brand}</div>`:''}
      <div class="card-name">${p.n}</div>
      ${p.ca?`<div class="card-ca">${p.ca}</div>`:''}
      ${specs?`<div class="card-specs-pdf">${specs}</div>`:''}
      ${vars}
    </div>
  </div>`;
}

    <p class="about-text">A Inova Fortis EPIs nasceu com um propósito claro: combater a normalização do risco nos ambientes de trabalho. Baseados em Frutal, MG, atendemos empresas e trabalhadores de toda a região com um portfólio completo de Equipamentos de Proteção Individual certificados pelo Ministério do Trabalho. Cada produto foi selecionado por critérios técnicos rigorosos: conforto real, desempenho comprovado e certificação ativa.</p>

async function gerarPDF(escala=2){
  const btn = document.querySelector('.btn-gerar');
  const orig = btn.innerHTML;
  btn.disabled = true;

  try {
    // Passo 1: converter imagens CDN para base64 (evita CORS no canvas)
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Carregando imagens...';
    // Pré-carrega imagens de produto E hero das categorias
    const heroImgs = [...document.querySelectorAll('.cat-hero-bg')].map(el => {
      const m = el.style.backgroundImage.match(/url\(['"]?([^'"\)]+)['"]?\)/);
      if(!m) return null;
      const img = new Image(); img.src = m[1]; return img;
    }).filter(Boolean);

    const cardImgs = [...document.querySelectorAll('.card-img img')];
    let done = 0;
    await Promise.all(cardImgs.map(async img => {
      if(!img.src.startsWith('http')) return;
      try {
        const resp = await fetch(img.src);
        const blob = await resp.blob();
        img.src = await new Promise(res => {
          const fr = new FileReader();
          fr.onloadend = () => res(fr.result);
          fr.readAsDataURL(blob);
        });
      } catch(e){}
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Imagens: ${++done}/${cardImgs.length}`;
    }));

    // Passo 2: gerar PDF página a página com html2canvas
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const pages = [...document.querySelectorAll('#documento .page')];

    for(let i = 0; i < pages.length; i++){
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Página ${i+1} de ${pages.length}...`;
      await new Promise(r => setTimeout(r, 30));

      const pg = pages[i];
      const canvas = await html2canvas(pg, {
        scale: escala,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 15000,
        backgroundColor: '#ffffff',
        removeContainer: true,
      });

      if(i > 0) pdf.addPage();
      const w = 210;
      const h = Math.min((canvas.height / canvas.width) * 210, 297);
      pdf.addImage(canvas.toDataURL('image/jpeg', escala >= 4 ? 0.97 : 0.93), 'JPEG', 0, 0, w, h);
    }

    const nome = escala >= 4 ? 'catalogo-fortis-2026-IMPRESSAO.pdf' : 'catalogo-fortis-2026.pdf';
    pdf.save(nome);
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14 3 6 11 2 7"/></svg> Download concluído!';
    setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 3000);

  } catch(err){
    console.error('Erro ao gerar PDF:', err);
    btn.innerHTML = 'Erro — tente novamente';
    setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 4000);
  }
}
